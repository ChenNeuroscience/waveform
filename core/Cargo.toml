[package]
name = "waveform-core"
version = "2.0.0"
edition = "2021"
license = "MIT"
[dependencies]
rustfft = { version = "6.4.1", features = ["wasm_simd"] }
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"], optional = true }
[lib]
crate-type = ["cdylib", "rlib"]
[profile.release]
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
[features]
cli = ["dep:clap"]
[[bin]]
name = "synthetic"
path = "cli/synthetic.rs"
required-features = ["cli"]
